name: Deploy web app

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/deploy-web.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/deploy-web.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'
      - run: bun install --filter @caccia/web --frozen-lockfile
      - run: bun run --cwd apps/web build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-web-production
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'
      - run: bun install --filter @caccia/web --frozen-lockfile
      - run: bun run --cwd apps/web build
      - run: bun run --cwd apps/web cf:deploy:built
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
